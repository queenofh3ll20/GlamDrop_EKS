apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: glamdrop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: booking-service-pdb
  namespace: glamdrop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: booking-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
